<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-H41739MRVS"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-H41739MRVS', {
            'page_title': '{{ page.title | default: site.title }}',
            'page_path': '{{ page.url }}',
            {% if page.categories %}'content_group': '{{ page.categories | first }}',{% else %}'content_group': 'general',{% endif %}
            {% if page.tags %}'page_tags': '{{ page.tags | join: ", " }}',{% endif %}
            {% if page.date %}'publish_date': '{{ page.date | date: "%Y-%m-%d" }}',{% endif %}
        });
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/assets/bookshelf-favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'inter': ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
        integrity="sha512-Fo3rlrZj/k7ujTnHg4CGR2D7kSs0v4LLanw2qksYuRlEzO+tcaEPQogQ0KaoGN26/zrn20ImR1DfuLWnOo7aBA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <title>{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
</head>

<body class="bg-white text-gray-900 font-inter antialiased">
    {% include header.html %}

    <!-- Top Banner -->
    <div class="mt-[56px] bg-gradient-to-r from-blue-600 to-indigo-600 text-white py-2 text-center">
        <p class="text-sm font-medium">Unlock possibilities together. Let's connect on <a href="https://www.linkedin.com/in/akshay-sharma-akay/"
                target="_blank" class="underline hover:text-blue-200 transition-colors">LinkedIn</a></p>
    </div>

    <main class="min-h-screen">
        {{ content }}
    </main>

    <!-- Let's Connect Section -->
    {% include connect-section.html %}

    {% include footer.html %}

</body>

</html>
